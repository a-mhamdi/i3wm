# -----------
#  picom.conf
# -----------

# Rounded corners

corner-radius = 10;
round-borders = 1;

# Exclude windows that shouldn't have rounded corners
rounded-corners-exclude = [
  "window_type = 'dock'",      # polybar
  "window_type = 'desktop'",   # desktop background
  "class_g = 'i3bar'",
  "class_g = 'Rofi'"           # rofi handles its own rounding
];

# Shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.6;
shadow-offset-x = -10;
shadow-offset-y = -10;

# Dracula-tinted shadow (#282a36 at low opacity feels cohesive)
shadow-color = "#1a1b26"

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading

fading = true;
fade-in-step  = 0.06;
fade-out-step = 0.06;
fade-delta    = 8;

fade-exclude = [];

# Transparency / Opacity

# Slightly dim inactive windows — subtle, not distracting
active-opacity   = 1.0;
inactive-opacity = 0.92;
frame-opacity    = 0.9;

# Don't dim these regardless
inactive-opacity-override = false;

opacity-rule = [
  "100:window_type = 'dock'",        # polybar always opaque
  "100:window_type = 'notification'",
  "100:class_g = 'Rofi'",
  "95:class_g  = 'Alacritty'",
  "95:class_g  = 'kitty'",
  "95:class_g  = 'URxvt'",
  "90:class_g  = 'Code'",            # VS Code slight transparency
  "100:class_g = 'firefox'",
  "100:class_g = 'Brave-browser'"
];

# Background blur

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-kern = "3x3box";

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Backend & performance

# glx is faster and required for blur; use xrender if glx causes issues
backend = "glx";

# GLX options
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# Sync with display refresh to avoid tearing
vsync = true;

# Window type rules

wintypes = {
  dock = {
    shadow   = false;
    fade     = false;
    opacity  = 1.0;
    blur-background = false;
  };
  tooltip = {
    shadow   = false;
    fade     = true;
    opacity  = 0.95;
    focus    = true;
  };
  popup_menu = {
    shadow  = true;
    opacity = 0.97;
  };
  dropdown_menu = {
    shadow  = true;
    opacity = 0.97;
  };
  notification = {
    shadow  = false;
    fade    = true;
    opacity = 1.0;
  };
  normal = {
    shadow = true;
    fade   = true;
  };
};
