; ---------------------------------------
; POLYBAR CONFIG - i3wm bar configuration
; ---------------------------------------

[colors]
background = #282a36
background-alt = #44475a
foreground = #f8f8f2
primary = #bd93f9
secondary = #50fa7b
warning = #ffb86c
alert = #ff79c6
disabled = #6272a4

[bar/main]
; monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0

; Position the bar
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}
foreground-alt = ${colors.foreground}

line-size = 2pt
border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "FiraCode Nerd Font:free:pixelsize=10;2"
font-1 = "Noto Color Emoji:fontformat=truetype:pixelsize=16:scale=10;2"

modules-left = i3
modules-center = date
modules-right = filesystem memory cpu pulseaudio wlan eth battery

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-unfocused = %index%
label-visible = %index%
label-visible-background = ${colors.background-alt}
label-visible-underline = ${colors.primary}
label-visible-padding = 1
label-urgent = %index%
label-separator = " "

; Cursor actions
;cursor-click = pointer
;cursor-scroll = ns-resize
; Window manager integration
enable-ipc = true

[module/date]
type     = internal/date
interval = 5

date= %H:%M
date-alt = %a %Y-%m-%d  %H:%M:%S

label            = %date%
label-foreground = ${colors.primary}

; --- FS ---
[module/filesystem]
type     = internal/fs
interval = 30
mount-0  = /

warn-percentage = 90

label-mounted            = DSK:%percentage_used%%
label-mounted-foreground = ${colors.secondary}

label-warn            = DSK:%percentage_used%%!
label-warn-foreground = ${colors.alert}

label-unmounted            = DSK:N/A
label-unmounted-foreground = ${colors.disabled}

; --- MEM ---
[module/memory]
type     = internal/memory
interval = 3

format-prefix            = "RAM:"
format-prefix-foreground = ${colors.primary}
label                    = %percentage_used%%

; --- CPU ---
[module/cpu]
type     = internal/cpu
interval = 2

format-prefix            = "CPU:"
format-prefix-foreground = ${colors.primary}
label                    = %percentage%%

; --- PULSEAUDIO ---
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true

label-muted-foreground = ${colors.disabled}
label-muted = %{T2}🔇%{T-}
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = %{T2}🔈%{T-}
ramp-volume-1 = %{T2}🔉%{T-}
ramp-volume-2 = %{T2}🔊%{T-}

click-right = pavucontrol &

; --- WLAN ---
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "WLAN:"
format-connected-prefix-foreground = ${colors.secondary}
label-connected = %essid%
format-disconnected = <label-disconnected>
label-disconnected = "❌ WLAN"
label-disconnected-foreground = ${colors.disabled}

; --- ETH ---
[module/eth]
type = internal/network
interface-type = wired
interval = 5.0

format-connected = <label-connected>
format-connected-prefix = "ETH:"
format-connected-prefix-foreground = ${colors.secondary}
label-connected = "✅ ETH"
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected = "❌ ETH"
label-disconnected-foreground = ${colors.disabled}

; --- BATTERY ---
[module/battery]
type    = internal/battery
battery = BAT0
adapter = ADP1
full-at = 85

poll-interval = 30

; Charging
format-charging            = <label-charging>
format-charging-prefix     = "CHR:"
format-charging-prefix-foreground = ${colors.secondary}
label-charging             = %percentage%%

; Discharging — text ramp, no emoji rendering issues
format-discharging = <ramp-capacity> <label-discharging>
label-discharging  = %percentage%%

; Full
label-full             = Full
format-full            = <label-full>
format-full-prefix     = "BAT:"
format-full-prefix-foreground = ${colors.secondary}

; Capacity ramp
ramp-capacity-0            = BAT:
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1            = BAT:
ramp-capacity-1-foreground = ${colors.warning}
ramp-capacity-2            = BAT:
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3            = BAT:
ramp-capacity-3-foreground = ${colors.primary}
ramp-capacity-4            = BAT:
ramp-capacity-4-foreground = ${colors.secondary}

; Low battery
format-low           = <label-low>
format-low-prefix    = "LOW:"
format-low-prefix-foreground = ${colors.alert}
label-low            = %percentage%%
label-low-foreground = ${colors.alert}
low-at               = 15

; --- SETTINGS ---
[settings]
screenchange-reload = true
